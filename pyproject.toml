[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.1.0"
description = "Implied volatility surface construction: SVI/SSVI fitting, arbitrage checks, Dupire local vol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
data = ["yfinance>=0.2"]
pricer = ["sppricer @ git+https://github.com/hossainyousuf751/sp-pricer"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
