[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.2.0"
description = "Implied volatility surface construction: SVI/SSVI fitting, arbitrage checks, Dupire local vol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
pricer = ["sppricer @ git+https://github.com/hossainyousuf751/sp-pricer"]
plot = ["matplotlib>=3.7"]
data = ["yfinance>=0.2"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs local data or minutes of runtime; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F"]
